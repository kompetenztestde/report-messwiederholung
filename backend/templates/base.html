{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% for file in css_files %}
        <link rel="stylesheet" type="text/css" href="{% static file %}" />
    {% endfor %}
    <link rel="shortcut icon" type="image/png" href="/static/extract/favicon.ico"/>
</head>

<body>
    {% block content %}
    {% endblock content %}
    {% for file in js_files %}
        <script src="{% static file %}" type="module"></script>
    {% endfor %}
</body>

</html>
